  <!-- Instant Day/Night Theme Initializer (zero FOUC flash - auto set by system mood) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('oc-theme');
        if (t) localStorage.removeItem('oc-theme');
        document.documentElement.removeAttribute('data-theme');
      } catch (e) { }
    })();
  </script>

  <!-- =========================================================================
       Install App বাটন শো/হাইড অপশন (visible / unvisible):
       - 'visible'   দিলে Install App বাটন শো করবে
       - 'unvisible' দিলে Install App বাটন শো করবে না
       ========================================================================= -->
  <script>
    /* Install App বাটন দেখানোর অপশন: 'visible' অথবা 'unvisible' */
    var INSTALL_APP_BUTTON_OPTION = 'invisible'; // 'visible' দিলে show করবে, 'unvisible' দিলে show করবে না
    window.INSTALL_BUTTON_OPTION = INSTALL_APP_BUTTON_OPTION;

    (function () {
      try {
        var opt = String(window.INSTALL_BUTTON_OPTION || '').toLowerCase().trim();
        if (opt === 'unvisible' || opt === 'invisible' || opt === 'hide' || opt === 'hidden') {
          document.documentElement.setAttribute('data-install-button', 'unvisible');
        } else {
          document.documentElement.setAttribute('data-install-button', 'visible');
        }
      } catch (e) { }
    })();
  </script>

  <!-- Dynamic tab favicon cache buster to force browser tab to refresh icon immediately -->
  <script>
    (function () {
      try {
        var bust = 'v=2.11.66&t=' + Date.now();
        var links = document.querySelectorAll("link[rel*='icon']");
        links.forEach(function (l) {
          var base = l.getAttribute('href') || '';
          if (base.indexOf('?') > -1) base = base.split('?')[0];
          l.setAttribute('href', base + '?' + bust);
        });
      } catch (e) { }
    })();
  </script>
