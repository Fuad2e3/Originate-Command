  <!-- Instant Day/Night Theme Initializer (zero FOUC flash - auto set by system mood) & LocalStorage Policy Cleanse -->
  <script>
    (function () {
      try {
        localStorage.removeItem('oc-theme');
        var t = localStorage.getItem('oc-theme');
        document.documentElement.removeAttribute('data-theme');

        // Immediately purge old demo/seed policies from cached localStorage (oc-state-v2 and legacy keys)
        var demoMap = {
          'pol-web-qa': 1, 'pol-web-git': 1, 'pol-admin-punch': 1, 'pol-admin-leave': 1,
          'pol-bizops-sla': 1, 'pol-leadgen-quality': 1, 'pol-outreach-compliance': 1, 'pol-social-brand': 1,
          'pol-conduct': 1, 'pol-confidentiality': 1, 'pol-transparency': 1
        };
        var stateKeys = ['oc-state-v2', 'originate_command_state', 'oc-state'];
        stateKeys.forEach(function (k) {
          try {
            var raw = localStorage.getItem(k);
            if (!raw) return;
            var parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.policies)) {
              var pBefore = parsed.policies.length;
              parsed.policies = parsed.policies.filter(function (p) {
                return p && p.id && !demoMap[p.id] && p.department !== 'all';
              });
              parsed._policies_seeded = true;
              if (parsed.policies.length !== pBefore) {
                localStorage.setItem(k, JSON.stringify(parsed));
              }
            }
          } catch (_) {}
        });

        // Record tombstones in localStorage so demo policies never resurrect
        var delMap = {};
        try {
          var d1 = JSON.parse(localStorage.getItem('oc_deleted_policies') || '{}') || {};
          var d2 = JSON.parse(localStorage.getItem('oc_deleted_policy_ids') || '{}') || {};
          Object.assign(delMap, d1, d2);
        } catch (_) {}
        Object.keys(demoMap).forEach(function (id) { delMap[id] = true; });
        localStorage.setItem('oc_deleted_policies', JSON.stringify(delMap));
        localStorage.setItem('oc_deleted_policy_ids', JSON.stringify(delMap));
      } catch (e) { }
    })();
  </script>

  <!-- =========================================================================
       Install App বাটন শো/হাইড অপশন (visible / unvisible):
       - 'visible'   দিলে Install App বাটন শো করবে
       - 'unvisible' দিলে Install App বাটন শো করবে না
       ========================================================================= -->
  <script>
    /* Install App বাটন দেখানোর অপশন: 'visible' অথবা 'unvisible' */
    var INSTALL_APP_BUTTON_OPTION = 'invisible'; // 'visible' দিলে show করবে, 'unvisible' দিলে show করবে না
    window.INSTALL_BUTTON_OPTION = INSTALL_APP_BUTTON_OPTION;

    (function () {
      try {
        var opt = String(window.INSTALL_BUTTON_OPTION || '').toLowerCase().trim();
        if (opt === 'unvisible' || opt === 'invisible' || opt === 'hide' || opt === 'hidden') {
          document.documentElement.setAttribute('data-install-button', 'unvisible');
        } else {
          document.documentElement.setAttribute('data-install-button', 'visible');
        }
      } catch (e) { }
    })();
  </script>

  <!-- Dynamic tab favicon cache buster to force browser tab to refresh icon immediately -->
  <script>
    (function () {
      try {
        var bust = 'v=2.11.83&t=' + Date.now();
        var links = document.querySelectorAll("link[rel*='icon']");
        links.forEach(function (l) {
          var base = l.getAttribute('href') || '';
          if (base.indexOf('?') > -1) base = base.split('?')[0];
          l.setAttribute('href', base + '?' + bust);
        });
      } catch (e) { }
    })();
  </script>
