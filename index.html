<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Originate Command</title>
  <meta name="description"
    content="Unified todo board and instruction system for Originate Marketing, built to the OM SRS 001 specification.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- one typeface for the whole product; code and data ride the system mono
       stack, so this is the only font request the app makes -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..700&amp;display=swap">

  <!-- stylesheets load in cascade order; see README.md -->
  <link rel="stylesheet" href="assets/css/01-tokens.css?v=2.11.26">
  <link rel="stylesheet" href="assets/css/02-base.css?v=2.11.26">
  <link rel="stylesheet" href="assets/css/03-layout.css?v=2.11.26">
  <link rel="stylesheet" href="assets/css/04-components.css?v=2.11.26">
  <link rel="stylesheet" href="assets/css/05-touch.css?v=2.11.26">
</head>

<body>

  <div id="root">
    <noscript>
      <p style="padding:24px">Originate Command needs JavaScript. The specification it is built from is
        readable without it at <a href="spec/">spec/</a>.</p>
    </noscript>
  </div>

  <div class="toasts" aria-live="polite"></div>

  <!-- configuration & tunnel gateway sync -->
  <script src="assets/config.js?v=2.11.26"></script>

  <!-- icons, data and rules first, then shared helpers, then views, then the shell -->
  <script src="assets/js/backend.js?v=2.11.26" defer></script>
  <script src="assets/js/icons.js?v=2.11.26" defer></script>
  <script src="assets/js/store.js?v=2.11.26" defer></script>
  <script src="assets/js/permissions.js?v=2.11.26" defer></script>
  <script src="assets/js/ui.js?v=2.11.26" defer></script>
  <script src="assets/js/board.js?v=2.11.26" defer></script>
  <script src="assets/js/dashboard.js?v=2.11.26" defer></script>
  <script src="assets/js/groups.js?v=2.11.26" defer></script>
  <script src="assets/js/reports.js?v=2.11.26" defer></script>
  <script src="assets/js/people.js?v=2.11.26" defer></script>
  <script src="assets/js/clients.js?v=2.11.26" defer></script>
  <script src="assets/js/messages.js?v=2.11.26" defer></script>
  <script src="assets/js/policy.js?v=2.11.26" defer></script>
  <script src="assets/js/activities.js?v=2.11.26" defer></script>
  <script src="assets/js/profile_portal.js?v=2.11.26" defer></script>
  <script src="assets/js/app.js?v=2.11.26" defer></script>
</body>

</html>
